# Android CI - deliberately NOT run on every push (GitHub Actions minutes are a scarce, shared budget; see CLAUDE.md section 32).
# It checks only what cannot be proven locally: the Android modules (shell, layer, resources) compile, lint passes, the layer unit
# tests (incl. theme contrast) pass, and the native libraries are 16 KB page-size aligned. JVM tests of :core and :otakit run locally
# and are repeated inside the OTA and release workflows, so they are not repeated here.
# Runs: manually (workflow_dispatch), or on pull requests that are READY FOR REVIEW (draft PRs are skipped). Docs/tooling-only changes never run it.
name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "tools/models/**", "ota/publish-request.json", ".github/workflows/release-*.yml", ".github/workflows/model-catalog.yml", ".github/workflows/ota-publish.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skipped jobs are not billed: draft pull requests never start the runner.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false   # feature branches may save the Gradle cache so later runs are not cold
      # The side-by-side test build is signed with the runner's debug key. Caching that key makes successive TEST builds updatable in place; it is a
      # throw-away key for the test application id only and is never the release key. If the cache is evicted the test app (synthetic data only) is reinstalled.
      - name: Stable debug key for the test build
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gd-test-debug-keystore-v1
      - name: Monotonic version code
        run: echo "GD_VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: Android lint, debug APK, layer unit tests (incl. theme contrast)
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:assembleDebug :applayer:testDebugUnitTest :app:testDebugUnitTest --console=plain 2>&1 | tee build.log
      - name: Show compiler/lint errors (only on failure)
        if: failure()
        run: |
          { grep -E '^e: |^e\\.|Unresolved|error: ' build.log | cut -c1-260 | head -25; grep -A14 'What went wrong' build.log | cut -c1-260 | head -40; } || true
      - name: Release signing guard (a release build without the permanent key must refuse, never fall back to debug signing)
        run: |
          set +e
          out=$(env -u GD_KEYSTORE -u GD_KEYSTORE_PASSWORD -u GD_KEY_ALIAS -u GD_KEY_PASSWORD ./gradlew :app:assembleRelease --console=plain 2>&1); code=$?
          echo "$out" | grep -E "Refusing to sign|FAILED|BUILD" | head -5
          [ "$code" -ne 0 ] && echo "$out" | grep -q "Refusing to sign a release build without the permanent signing key"
      - name: Side-by-side identity of the test APK (must not be the production application id)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | tee badging-test.txt | head -4
          grep -q "package: name='com.hotatticgames.gamedesigner.test'" badging-test.txt
          grep -q "versionName='5.0.0-test'" badging-test.txt
          grep -q "application-label:'Game Designer TEST'" badging-test.txt
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "certificate SHA-256 digest|Signer #1 certificate DN" | head -3
      - name: Distribution privacy audit (test APK and the OTA application-layer bundle)
        run: |
          set -euo pipefail
          python3 tools/check-distribution-privacy.py --selftest
          ./gradlew :otabundle:assembleDebug -q -PlayerVersion=0 -PlayerLabel=privacy-audit -PsourceSha=audit --console=plain
          W=$(mktemp -d); unzip -q -o otabundle/build/outputs/apk/debug/otabundle-debug.apk 'classes*.dex' -d "$W"; (cd "$W" && zip -X -q bundle.zip classes*.dex)
          python3 tools/check-distribution-privacy.py app/build/outputs/apk/debug/app-debug.apk "$W/bundle.zip"
      - name: 16 KB page-size qualification of every native library in the debug APK
        run: python3 tools/check-16kb.py app/build/outputs/apk/debug/app-debug.apk
      # Private test APK for the owner's phone: a build-system artifact only (zipped by GitHub, visible to repository collaborators), never a release.
      - name: Upload private debug APK
        uses: actions/upload-artifact@v4
        with:
          name: game-designer-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports
            applayer/build/reports
