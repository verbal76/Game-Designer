name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM unit tests (core, OTA kit)
        run: ./gradlew :core:test :otakit:test --stacktrace
      - name: Android lint, debug APK, layer unit tests (incl. theme contrast)
        run: ./gradlew :app:lintDebug :app:assembleDebug :applayer:testDebugUnitTest :app:testDebugUnitTest --stacktrace
      - name: Validate that an OTA bundle can be built, signed and verified (throwaway key, not published)
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/k"; ./gradlew -q :otakit:run --args="genkey $K" > /dev/null
          tools/ota/build-bundle.sh 2 ci-validation dev "$RUNNER_TEMP/ota-validate" "$K/ota-private.b64"
          ./gradlew -q :otakit:run --args="verify-channel --dir $RUNNER_TEMP/ota-validate --public-key $K/ota-public.b64 --api 1 --fingerprint $(tools/ota/fingerprint.sh)"
      - uses: actions/upload-artifact@v4
        with:
          name: game-designer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/tests
            otakit/build/reports/tests
            app/build/reports
            applayer/build/reports
