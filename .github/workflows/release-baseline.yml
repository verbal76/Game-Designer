# One-shot: publishes the already-built, CI-validated Physical Test Baseline 1 APK as a GitHub Release.
# It downloads the existing artifact (no rebuild) and targets the exact source commit. Runs only when this file changes.
name: Publish baseline release

on:
  push:
    paths: [".github/workflows/release-baseline.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  TAG: v1
  SOURCE_SHA: 2b53d80a1e8a5f08eaa3a7c77cd09b30b37c55ba
  SOURCE_RUN_ID: "37243066276"
  ARTIFACT_NAME: game-designer-debug-apk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(find dl -name '*.apk' | head -1)
          test -n "$apk"
          cp "$apk" Game-Designer-v1.apk
          sha=$(sha256sum Game-Designer-v1.apk | cut -d' ' -f1)
          echo "APK SHA-256: $sha"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Release $TAG already exists; nothing to do."; exit 0; fi
          {
            echo "**Physical Test Baseline 1** - first installable Game Designer prototype (debug-signed, for sideloading and physical testing only; not a production release)."
            echo
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Built and validated by CI run $SOURCE_RUN_ID (artifact 11318166547): 63 core tests, lint, debug build and app unit tests all green."
            echo "- File: \`Game-Designer-v1.apk\`"
            echo "- SHA-256: \`$sha\`"
            echo "- Not yet installed or run on a device at the time of publishing."
          } > notes.md
          gh release create "$TAG" Game-Designer-v1.apk --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Game Designer v1 - Physical Test Baseline 1" --notes-file notes.md --latest
