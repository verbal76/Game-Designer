# One-shot publication of Game Designer v2 (the OTA-capable native baseline) and the first dev OTA channel bundle.
# Runs only when THIS file changes (an explicit request), never on ordinary source pushes.
name: Publish v2 release

on:
  push:
    paths: [".github/workflows/release-v2.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signing-keys
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG: v2

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Monotonic version code
        run: echo "GD_VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Load persistent signing material
        run: tools/ota/ensure-keys.sh "$RUNNER_TEMP/keys"

      - name: Pin the OTA trust key into the APK
        run: |
          mkdir -p app/src/main/assets/ota
          { echo "# keys allowed to sign OTA manifests"; cat "$RUNNER_TEMP/keys/ota-public.b64"; echo; } > app/src/main/assets/ota/trusted_keys.txt

      - name: Tests (core, OTA kit, theme contrast, lint)
        run: ./gradlew :core:test :otakit:test :applayer:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build signed release APK
        run: |
          export GD_KEYSTORE="$RUNNER_TEMP/keys/release.keystore"
          export GD_KEYSTORE_PASSWORD="$(sed -n 's/^password=//p' "$RUNNER_TEMP/keys/release.properties")"
          export GD_KEY_PASSWORD="$GD_KEYSTORE_PASSWORD"
          export GD_KEY_ALIAS=gamedesigner
          ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Game-Designer-v2.apk

      - name: Verify the actual APK
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --verbose --print-certs Game-Designer-v2.apk | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true\|Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          "$BT/aapt2" dump badging Game-Designer-v2.apk | tee badging.txt | head -8
          grep -q "package: name='com.hotatticgames.gamedesigner'" badging.txt
          grep -q "versionName='2.0.0'" badging.txt
          grep -q "minSdkVersion:'28'" badging.txt
          unzip -l Game-Designer-v2.apk | tee contents.txt >/dev/null
          awk '$1>100000 && /webp$/ {f=1} END{exit !f}' contents.txt   # the large Hot Attic Games logo webp (paths may be shortened by AGP)
          grep -q "assets/ota/trusted_keys.txt" contents.txt          # OTA trust anchor
          mkdir -p x && unzip -q -o Game-Designer-v2.apk 'classes*.dex' -d x
          grep -a -q 'Lcom/hotattic/gamedesigner/applayer/AppLayerEntry;' x/classes*.dex   # bundled fallback layer
          grep -a -q 'Lcom/hotattic/gamedesigner/otakit/OtaSelector;' x/classes*.dex       # verification/rollback engine
          grep -a -q 'Lcom/hotattic/gamedesigner/shell/ChildFirstDexClassLoader;' x/classes*.dex
          echo "APK identity, signature, splash resource, OTA trust anchor, bundled fallback layer and OTA runtime all present"
          sha256sum Game-Designer-v2.apk | tee sha.txt

      - name: Build and verify the OTA proof bundle (version 2, label ota-proof-2)
        run: |
          set -euo pipefail
          tools/ota/build-bundle.sh 2 ota-proof-2 dev "$RUNNER_TEMP/ota-dev" "$RUNNER_TEMP/keys/ota-private.b64" "$GITHUB_SHA"
          ./gradlew -q :otakit:run --args="verify-channel --dir $RUNNER_TEMP/ota-dev --public-key $RUNNER_TEMP/keys/ota-public.b64 --api 1 --fingerprint $(tools/ota/fingerprint.sh)"

      - name: Publish APK release v2 (does not touch v1)
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 sha.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 1; fi
          VC=$(grep -o "versionCode='[0-9]*'" badging.txt | head -1 | grep -o "[0-9]*")
          cat > notes.md <<NOTES
          **Game Designer v2 - OTA-capable native baseline** (physical-test build; signed with the persistent Game Designer release key).

          - Fixes unreadable (dark-on-dark) onboarding text; the app is now always dark with explicitly checked contrast.
          - New native/runtime baseline with an over-the-air update layer (see docs/OTA.md for what updates OTA and what needs a new APK).
          - Source commit: \`$GITHUB_SHA\`
          - versionName 2.0.0, versionCode $VC, runtime \`$(tools/ota/fingerprint.sh)\`
          - File: \`Game-Designer-v2.apk\`
          - SHA-256: \`$SHA\`

          **Installing over v1:** v1 was signed with a throwaway CI key, so Android will refuse to update over it. Export a backup in Settings, uninstall v1, then install this APK, then restore. Future APKs signed with this key install over v2 normally.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" Game-Designer-v2.apk --target "$GITHUB_SHA" --title "Game Designer v2 - OTA-capable baseline" --notes-file notes.md --latest

      - name: Publish the dev OTA channel
        run: tools/ota/publish.sh dev "$RUNNER_TEMP/ota-dev"

      - name: Live OTA proof against the published channel
        run: |
          set -euo pipefail
          VC=$(grep -o "versionCode='[0-9]*'" badging.txt | head -1 | grep -o "[0-9]*")
          ./gradlew -q :otakit:run --args="live-proof --base-url https://github.com/$GITHUB_REPOSITORY/releases/download --channel dev --public-key $RUNNER_TEMP/keys/ota-public.b64 --workdir $RUNNER_TEMP/proof --shell-code $VC --api 1 --fingerprint $(tools/ota/fingerprint.sh) --bundled-version 1" | tee proof.txt
          ! grep -q '^FAIL' proof.txt
          { echo '### v2 release'; cat sha.txt; echo '### OTA live proof'; echo '```'; cat proof.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
