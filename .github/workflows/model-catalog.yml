# Records VERIFIED metadata (size, SHA-256, license, gating) for on-device model packages by reading Hugging Face LFS pointers.
# Runs only when tools/models/candidates.json changes. Publishes catalog.json as an asset of the `model-catalog` prerelease.
name: Model catalog discovery

on:
  push:
    paths: ["tools/models/candidates.json", "tools/models/discover.py"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Discover
        run: python3 tools/models/discover.py tools/models/candidates.json catalog.json | tee discover.log
      - name: Runtime and model-card facts (LiteRT-LM versions, README of curated models)
        run: |
          {
            echo "## litertlm-android versions on Google Maven"
            curl -sf https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android/maven-metadata.xml | grep -E "<(latest|release|version)>" | tail -12 || echo "metadata unavailable"
            for r in gemma-4-E2B-it-litert-lm gemma-4-E4B-it-litert-lm Qwen3-4B-Instruct-2507 Qwen3-1.7B Qwen3-0.6B-int4 Qwen3-8B Qwen2.5-1.5B-Instruct; do
              echo; echo "## README litert-community/$r"
              curl -sfL "https://huggingface.co/litert-community/$r/raw/main/README.md" | head -90 || echo "no readme"
            done
          } > facts.txt
      - name: Publish catalog.json
        run: |
          set -euo pipefail
          gh release view model-catalog >/dev/null 2>&1 || gh release create model-catalog --prerelease --title "Model catalog (verified metadata)" --notes "Machine-generated by tools/models/discover.py. Not an app release." --target "$GITHUB_SHA"
          gh release upload model-catalog catalog.json discover.log facts.txt --clobber
