# One-shot publication of Game Designer v3 (internal physical-test APK: on-device LLM runtime, shell API 2).
# Runs only when THIS file changes (an explicit request), never on ordinary source pushes. Not a store release.
name: Publish v3 release

on:
  push:
    paths: [".github/workflows/release-v3.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signing-keys
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG: v3

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Monotonic version code
        run: echo "GD_VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Load persistent signing material
        run: tools/ota/ensure-keys.sh "$RUNNER_TEMP/keys"

      - name: Pin the OTA trust key into the APK
        run: |
          mkdir -p app/src/main/assets/ota
          { echo "# keys allowed to sign OTA manifests"; cat "$RUNNER_TEMP/keys/ota-public.b64"; echo; } > app/src/main/assets/ota/trusted_keys.txt

      - name: Tests (core, OTA kit, theme contrast, lint)
        run: ./gradlew :core:test :otakit:test :applayer:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build signed release APK
        run: |
          export GD_KEYSTORE="$RUNNER_TEMP/keys/release.keystore"
          export GD_KEYSTORE_PASSWORD="$(sed -n 's/^password=//p' "$RUNNER_TEMP/keys/release.properties")"
          export GD_KEY_PASSWORD="$GD_KEYSTORE_PASSWORD"
          export GD_KEY_ALIAS=gamedesigner
          ./gradlew :app:assembleRelease -PsourceSha="$(git rev-parse --short=8 HEAD)" --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Game-Designer-v3.apk

      - name: Verify the actual APK
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs Game-Designer-v3.apk | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true\|Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          "$BT/aapt2" dump badging Game-Designer-v3.apk | tee badging.txt | head -8
          grep -q "package: name='com.hotatticgames.gamedesigner'" badging.txt
          grep -q "versionName='3.0.0'" badging.txt
          grep -q "minSdkVersion:'28'" badging.txt
          unzip -l Game-Designer-v3.apk | tee contents.txt >/dev/null
          awk '$1>100000 && /webp$/ {f=1} END{exit !f}' contents.txt
          grep -q "assets/ota/trusted_keys.txt" contents.txt
          mkdir -p x && unzip -q -o Game-Designer-v3.apk 'classes*.dex' -d x
          grep -a -q 'Lcom/hotattic/gamedesigner/applayer/AppLayerEntry;' x/classes*.dex
          grep -a -q 'Lcom/hotattic/gamedesigner/otakit/OtaSelector;' x/classes*.dex
          grep -a -q 'Lcom/hotattic/gamedesigner/shell/LiteRtLocalLlm;' x/classes*.dex
          sha256sum Game-Designer-v3.apk | tee sha.txt

      - name: 16 KB page-size qualification of the release APK
        run: python3 tools/check-16kb.py Game-Designer-v3.apk

      - name: Upgrade compatibility with the published v2 APK (same signing certificate, higher versionCode)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          gh release download v2 -p Game-Designer-v2.apk -D old
          "$BT/apksigner" verify --print-certs old/Game-Designer-v2.apk | grep 'certificate SHA-256 digest' | head -1 | tee old.cert
          "$BT/apksigner" verify --print-certs Game-Designer-v3.apk | grep 'certificate SHA-256 digest' | head -1 | tee new.cert
          diff old.cert new.cert
          OLD=$("$BT/aapt2" dump badging old/Game-Designer-v2.apk | grep -o "versionCode='[0-9]*'" | head -1 | grep -o "[0-9]*")
          NEW=$(grep -o "versionCode='[0-9]*'" badging.txt | head -1 | grep -o "[0-9]*")
          echo "v2 versionCode=$OLD, v3 versionCode=$NEW"
          test "$NEW" -gt "$OLD"

      - name: Publish APK release v3 (does not touch v1, v2 or the OTA channels)
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 sha.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 1; fi
          VC=$(grep -o "versionCode='[0-9]*'" badging.txt | head -1 | grep -o "[0-9]*")
          FP=$(tools/ota/fingerprint.sh)
          cat > notes.md <<NOTES
          **Game Designer v3 - on-device LLM native generation** (internal physical-test build; NOT a store release). Signed with the same persistent release key as v2, so it installs over v2.

          - New native shell API 2: LiteRT-LM (CPU) runtime with load/unload/status/diagnostics so the model manager can really run a model.
          - Model manager: device profile, compatible model choices, resumable download, SHA-256 verification, install, load, Test Bob.
          - Bundled application layer v3.0 (design-intelligence line preserved). OTA from here needs runtime fingerprint \`$FP\` and sequence >= 6; v2-line OTA bundles are rejected by this APK by design.
          - Source commit: \`$GITHUB_SHA\`
          - versionName 3.0.0, versionCode $VC
          - File: \`Game-Designer-v3.apk\`
          - SHA-256: \`$SHA\`
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" Game-Designer-v3.apk --target "$GITHUB_SHA" --title "Game Designer v3 - on-device LLM" --notes-file notes.md

      - name: Step summary
        run: |
          { echo '### v3 release'; cat sha.txt; echo '### 16 KB'; echo passed; } >> "$GITHUB_STEP_SUMMARY"
